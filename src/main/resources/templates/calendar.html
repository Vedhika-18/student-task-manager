<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app-shell"><aside class="sidebar"><div class="brand">Study<span>Flow</span></div><nav><a th:href="@{/dashboard}">▦ Dashboard</a><a th:href="@{/tasks}">☷ My Tasks</a><a class="active" th:href="@{/calendar}">▣ Calendar</a><a th:href="@{/tasks/new}">＋ Add Task</a></nav><form method="post" th:action="@{/logout}" class="logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">↪ Log out</button></form></aside>
<main class="content"><div class="topbar"><div><p class="eyebrow">PLANNING</p><h1>Task calendar</h1><p class="muted">See deadlines and plan your month.</p></div><a class="button primary" th:href="@{/tasks/new}">＋ New task</a></div>
<section class="panel calendar-panel"><div class="calendar-header"><a class="button secondary" th:href="@{/calendar(month=${calendar.month.minusMonths(1).toString().substring(0,7)})}">←</a><h2 th:text="${#temporals.format(calendar.month, 'MMMM yyyy')}">Month</h2><a class="button secondary" th:href="@{/calendar(month=${calendar.month.plusMonths(1).toString().substring(0,7)})}">→</a></div><div class="calendar-week"><span th:each="day : ${ {'Mon','Tue','Wed','Thu','Fri','Sat','Sun'} }" th:text="${day}"></span></div><div id="calendarGrid" class="calendar-grid"></div></section>
<section class="panel selected-date" th:if="${calendar.selectedDate}"><h2 th:text="${#temporals.format(calendar.selectedDate, 'EEEE, d MMMM')}">Selected date</h2><a class="calendar-task" th:each="task : ${calendar.selectedDateTasks}" th:href="@{'/tasks/' + ${task.id}}"><span class="priority-dot" th:classappend="${task.priority.name().toLowerCase()}"></span><strong th:text="${task.title}"></strong><small th:text="${task.subject}"></small></a><p class="muted" th:if="${#lists.isEmpty(calendar.selectedDateTasks)}">No tasks due on this date.</p></section>
</main></div>
<script th:inline="javascript">
    // LocalDate is date-only data. Keep it as year/month/day strings; never parse it with Date.
    const calendarYear = /*[[${calendar.month.year}]]*/ 2026;
    const calendarMonthIndex = /*[[${calendar.month.monthValue - 1}]]*/ 10;
    const tasks = /*[[${calendar.monthTasks}]]*/ [];
    const grid = document.getElementById('calendarGrid');
    const month = `${calendarYear}-${String(calendarMonthIndex + 1).padStart(2, '0')}`;
    const firstDayMondayIndex = (new Date(calendarYear, calendarMonthIndex, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(calendarYear, calendarMonthIndex + 1, 0).getDate();
    for (let i = 0; i < firstDayMondayIndex; i++) {
        grid.insertAdjacentHTML('beforeend', '<span class="calendar-cell blank"></span>');
    }
    for (let day = 1; day <= daysInMonth; day++) {
        const date = `${month}-${String(day).padStart(2, '0')}`;
        const dayTasks = tasks.filter(task => String(task.dueDate) === date);
        const content = dayTasks.map(task =>
            `<a href="/tasks/${task.id}" class="calendar-task"><span class="priority-dot ${task.priority.toLowerCase()}"></span>${task.title}</a>`
        ).join('');
        grid.insertAdjacentHTML('beforeend',
            `<div class="calendar-cell"><a class="calendar-date" href="/calendar?month=${month}&date=${date}"><b>${day}</b></a>${content}</div>`);
    }
</script>
</body></html>
