<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task details | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Study<span>Flow</span></div><nav><a th:href="@{/dashboard}">▦ Dashboard</a><a class="active" th:href="@{/tasks}">☷ My Tasks</a><a th:href="@{/calendar}">▣ Calendar</a><a th:href="@{/tasks/new}">＋ Add Task</a></nav><form method="post" th:action="@{/logout}" class="logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">↪ Log out</button></form></aside><main class="content narrow"><a class="back" th:href="@{/tasks}">← Back to My Tasks</a><div class="panel"><div class="topbar"><div><p class="eyebrow" th:text="${task.subject}">SUBJECT</p><h1 th:text="${task.title}">Task</h1></div><a class="button primary" th:href="@{'/tasks/' + ${task.id} + '/edit'}">Edit task</a></div><p class="task-description" th:text="${task.description}" th:if="${task.description}"></p><div class="detail-grid"><div><span class="muted">Due date</span><strong th:text="${task.dueDate}"></strong></div><div><span class="muted">Priority</span><span class="pill" th:classappend="${task.priority.name().toLowerCase()}" th:text="${task.priority}"></span></div><div><span class="muted">Status</span><span class="pill status" th:classappend="${task.status.name().toLowerCase()}" th:text="${task.status.name().replace('_',' ')}"></span></div><div><span class="muted">Created</span><strong th:text="${#temporals.format(task.createdAt, 'd MMM yyyy, HH:mm')}"></strong></div><div><span class="muted">Last updated</span><strong th:text="${#temporals.format(task.updatedAt, 'd MMM yyyy, HH:mm')}"></strong></div></div><div class="form-actions"><form th:if="${task.status.name() != 'COMPLETED'}" method="post" th:action="@{'/tasks/' + ${task.id} + '/complete'}" onsubmit="return confirm('Mark this task as completed?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button complete-button" type="submit">✓ Complete task</button></form><a class="button secondary" th:href="@{/tasks}">Back to My Tasks</a></div></div></main></div></body></html>
