<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | StudyFlow'">Task | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Study<span>Flow</span></div><nav><a th:href="@{/dashboard}">▦ Dashboard</a><a th:href="@{/tasks}">☷ My Tasks</a><a class="active" th:href="@{/tasks/new}">＋ Add Task</a></nav><form method="post" th:action="@{/logout}" class="logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">↪ Log out</button></form></aside><main class="content narrow"><a class="back" th:href="@{/dashboard}">← Back to dashboard</a><h1 th:text="${pageTitle}">Add Task</h1><p class="muted">Capture the details so you know exactly what to work on.</p><form class="panel form-grid" method="post" th:action="${formAction}" th:object="${taskRequest}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="wide">Task title<input th:field="*{title}" required><small class="field-error" th:errors="*{title}"></small></label><label>Subject<input th:field="*{subject}" required><small class="field-error" th:errors="*{subject}"></small></label><label>Due date<input type="date" th:field="*{dueDate}" required><small class="field-error" th:errors="*{dueDate}"></small></label><label>Priority<select th:field="*{priority}"><option th:each="p : ${T(com.student.taskmanager.entity.Priority).values()}" th:value="${p}" th:text="${p}"></option></select></label><label>Status<select th:field="*{status}"><option th:each="s : ${T(com.student.taskmanager.entity.TaskStatus).values()}" th:value="${s}" th:text="${s.name().replace('_',' ')}"></option></select></label><label class="wide">Description<textarea th:field="*{description}" rows="5" placeholder="Optional notes or links..."></textarea></label><div class="wide form-actions"><a class="button secondary" th:href="@{/dashboard}">Cancel</a><button class="button primary" type="submit">Save task</button></div></form></main></div></body></html>
