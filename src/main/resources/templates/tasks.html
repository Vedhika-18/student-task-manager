<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Tasks | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Study<span>Flow</span></div><nav><a th:href="@{/dashboard}">▦ Dashboard</a><a class="active" th:href="@{/tasks}">☷ My Tasks</a><a th:href="@{/calendar}">▣ Calendar</a><a th:href="@{/tasks/new}">＋ Add Task</a></nav><form method="post" th:action="@{/logout}" class="logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">↪ Log out</button></form></aside>
<main class="content"><div class="topbar"><div><p class="eyebrow">TASK MANAGEMENT</p><h1>My Tasks</h1><p class="muted">Search, organize, and complete your academic work.</p></div><a class="button primary" th:href="@{/tasks/new}">＋ New task</a></div>
<div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
<section class="panel"><div class="toolbar"><form method="get" th:action="@{/tasks}" class="filter-form"><input name="search" th:value="${search}" placeholder="Search title or subject..."><select name="subject"><option value="">All subjects</option><option th:each="item : ${subjects}" th:value="${item}" th:text="${item}" th:selected="${item == selectedSubject}"></option></select><select name="sort"><option value="dueDate" th:selected="${selectedSort == 'dueDate'}">Nearest due date</option><option value="priority" th:selected="${selectedSort == 'priority'}">Highest priority</option><option value="created" th:selected="${selectedSort == 'created'}">Recently created</option><option value="title" th:selected="${selectedSort == 'title'}">Task title A-Z</option></select><button class="button primary" type="submit">Apply</button></form><div class="filters"><a th:classappend="${selectedStatus == 'ALL'} ? ' selected'" th:href="@{/tasks(search=${search},subject=${selectedSubject},sort=${selectedSort})}">All</a><a th:classappend="${selectedStatus == 'PENDING'} ? ' selected'" th:href="@{/tasks(status='PENDING',search=${search},subject=${selectedSubject},sort=${selectedSort})}">Pending</a><a th:classappend="${selectedStatus == 'IN_PROGRESS'} ? ' selected'" th:href="@{/tasks(status='IN_PROGRESS',search=${search},subject=${selectedSubject},sort=${selectedSort})}">In progress</a><a th:classappend="${selectedStatus == 'COMPLETED'} ? ' selected'" th:href="@{/tasks(status='COMPLETED',search=${search},subject=${selectedSubject},sort=${selectedSort})}">Completed</a></div></div>
<div class="table-wrap"><table><thead><tr><th>Task</th><th>Subject</th><th>Due date</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="task : ${tasks}"><td><a th:href="@{'/tasks/' + ${task.id}}" th:text="${task.title}"></a><small th:if="${task.description}" th:text="${task.description}"></small></td><td th:text="${task.subject}"></td><td th:classappend="${task.overdue} ? ' overdue'" th:text="${task.dueDate}"></td><td><span class="pill" th:classappend="${task.priority.name().toLowerCase()}" th:text="${task.priority}"></span></td><td><span class="pill status" th:classappend="${task.status.name().toLowerCase()}" th:text="${task.status.name().replace('_',' ')}"></span></td><td class="actions"><a th:href="@{'/tasks/' + ${task.id} + '/edit'}">Edit</a><form th:if="${task.status.name() != 'COMPLETED'}" method="post" th:action="@{'/tasks/' + ${task.id} + '/complete'}" onsubmit="return confirm('Mark this task as completed?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="complete-button" type="submit">✓ Complete</button></form><form method="post" th:action="@{'/tasks/' + ${task.id} + '/delete'}" onsubmit="return confirm('Delete this task?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="6" class="empty">No tasks found. Add your first task to get started.</td></tr></tbody></table></div></section></main></div></body></html>
