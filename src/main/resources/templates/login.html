<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><main class="auth-card">
    <div class="brand">Study<span>Flow</span></div><h1>Welcome back</h1><p class="muted">Sign in to manage your academic tasks.</p>
    <div class="alert success" th:if="${param.registered}">Account created. You can now sign in.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
    <div class="alert error" th:if="${param.error}">Invalid email or password.</div>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Email<input type="email" name="username" required autofocus></label>
        <label>Password<input type="password" name="password" required></label>
        <button class="button primary full" type="submit">Sign in</button>
    </form>
    <p class="center muted">New here? <a th:href="@{/register}">Create an account</a></p>
</main></body></html>
